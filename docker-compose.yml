services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092",
        ]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-init:
    image: apache/kafka:3.8.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092
      --create --if-not-exists
      --topic events-topic --partitions 1 --replication-factor 1"
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: clickhouse
    ports:
      - "8123:8123" # HTTP interface — matches CLICKHOUSE_URL in the app .env files
      - "9000:9000" # native TCP interface (clickhouse-client, admin tooling)
    environment:
      CLICKHOUSE_DB: mydb
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: default
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8123/ping",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  producer:
    build:
      context: ./producer
    container_name: producer
    env_file:
      - ./producer/.env
    environment:
      # .env points at localhost, which doesn't resolve between containers —
      # override with the in-network hostnames/ports instead.
      PORT: 8001
      KAFKA_BROKER: kafka:29092
    ports:
      - "8001:8001" # PORT from producer/.env
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8001/",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  consumer:
    build:
      context: ./consumer
    container_name: consumer
    env_file:
      - ./consumer/.env
    environment:
      PORT: 8002
      KAFKA_BROKER: kafka:29092
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USERNAME: default
      CLICKHOUSE_PASSWORD: default
      CLICKHOUSE_DATABASE: mydb
    ports:
      - "8002:8002" # PORT from consumer/.env
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8002/",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse-agent:
    build:
      context: ./clickhouse-agent
    container_name: clickhouse-agent
    env_file:
      - ./clickhouse-agent/.env # brings in OPENAI_API_KEY
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USERNAME: default
      CLICKHOUSE_PASSWORD: default
      CLICKHOUSE_DATABASE: mydb
    ports:
      - "3030:3030" # fastify.listen port hardcoded in clickhouse-agent/src/index.ts
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3030/",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  web-app:
    build:
      context: ./web-app
    container_name: web-app
    environment:
      PORT: 3000
      # In-network hostnames — "localhost" from inside this container would
      # mean web-app itself, not the other service containers.
      PRODUCER_URL: http://producer:8001
      CONSUMER_URL: http://consumer:8002
      SMART_ANALYSIS_URL: http://clickhouse-agent:3030
      CLICKHOUSE_URL: http://clickhouse:8123
      KAFKA_UI_URL: http://kafka-ui:8080
      KAFKA_BROKER_URL: kafka:29092
    ports:
      - "3000:3000"
    volumes:
      # Lets the /logs page read container list/logs via the Docker Engine
      # API (dockerode). Note: `:ro` only stops this container from
      # replacing the socket file — the daemon API reachable through it is
      # not restricted to reads. Fine for a local dev tool; our own code
      # only ever calls list/logs endpoints against it.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      producer:
        condition: service_healthy
      consumer:
        condition: service_healthy
      clickhouse-agent:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-ui:
        condition: service_started

volumes:
  kafka-data:
  clickhouse-data:
